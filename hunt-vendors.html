<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunt Vendors · Inteligência de mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0402;
  --navy: #1c0c06;
  --pd: #6b2410;
  --vi: #b8481a;
  --mg: #d9531e;
  --rd: #c8341f;
  --or: #f2711c;
  --go: #f5a03a;
  --ye: #f7c566;
  --wh: #fff1de;
  --glass: rgba(38, 17, 9, 0.55);
  --line: rgba(255, 241, 222, 0.11);
  --mut: rgba(255, 241, 222, 0.62);
  --grad: linear-gradient(115deg, #f2711c, #d9531e 48%, #8f2e12);
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  height: 100%;
}
*,
*::before,
*::after {
  box-sizing: inherit;
}
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--wh);
  font:
    15px/1.55 Manrope,
    system-ui,
    sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(
      1200px 760px at 88% -12%,
      rgba(232, 100, 28, 0.58),
      rgba(150, 56, 20, 0.26) 46%,
      transparent 72%
    ),
    radial-gradient(
      900px 700px at -8% 108%,
      rgba(106, 27, 206, 0.3),
      rgba(196, 80, 27, 0.12) 55%,
      transparent 68%
    ),
    linear-gradient(180deg, #1e0d06, #0a0402 78%);
}
h1,
h2,
h3,
.sora {
  font-family: Sora, Manrope, sans-serif;
  letter-spacing: -0.02em;
  margin: 0;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
a {
  color: var(--go);
  text-decoration: none;
}
:focus-visible {
  outline: 2px solid var(--ye);
  outline-offset: 2px;
  border-radius: 8px;
}
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px clamp(14px, 3vw, 32px);
  backdrop-filter: blur(18px);
  background: rgba(10, 4, 2, 0.62);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: Sora;
  font-weight: 700;
  background: none;
  border: 0;
  padding: 0;
}
.brand i {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: var(--grad);
  box-shadow: 0 0 22px rgba(242, 113, 28, 0.55);
}
.nav {
  margin-left: auto;
  display: flex;
  gap: 6px;
}
.nav button {
  background: transparent;
  border: 1px solid transparent;
  padding: 8px 14px;
  border-radius: 999px;
  color: var(--mut);
  font-weight: 600;
}
.nav button.on,
.nav button:hover {
  color: var(--wh);
  background: rgba(255, 241, 222, 0.08);
  border-color: var(--line);
}
.glass {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 22px;
  backdrop-filter: blur(16px);
  box-shadow:
    0 20px 50px -25px rgba(0, 0, 0, 0.8),
    inset 0 1px 0 rgba(255, 241, 222, 0.07);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255, 241, 222, 0.06);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--wh);
}
.chip.hot {
  background: rgba(242, 113, 28, 0.16);
  border-color: rgba(242, 113, 28, 0.5);
  color: var(--ye);
}
.chip.vio {
  background: rgba(106, 27, 206, 0.3);
  border-color: rgba(170, 120, 255, 0.55);
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(255, 241, 222, 0.07);
  font-weight: 600;
}
.btn.pri {
  background: var(--grad);
  border: 0;
  color: #fff;
  box-shadow: 0 8px 26px -8px var(--or);
}
svg.i {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.nd {
  color: var(--mut);
  font-style: italic;
}
/* home */
.hero {
  position: relative;
  padding: clamp(40px, 8vw, 96px) clamp(16px, 4vw, 48px) 34px;
  max-width: 1280px;
  margin: 0 auto;
}
.hero {
  z-index: 5;
}
.hero h1 {
  font-size: clamp(30px, 5vw, 58px);
  line-height: 1.04;
  max-width: 18ch;
  font-weight: 700;
}
.hero p {
  max-width: 52ch;
  color: var(--mut);
  font-size: 17px;
  margin: 18px 0 0;
}
.hs {
  position: relative;
  max-width: 580px;
  margin-top: 28px;
}
.search.big {
  padding: 0 18px;
  border-radius: 16px;
  background: rgba(255, 241, 222, 0.09);
  backdrop-filter: blur(14px);
  box-shadow: 0 18px 40px -22px rgba(242, 113, 28, 0.7);
}
.search.big:focus-within {
  border-color: rgba(245, 160, 58, 0.7);
}
.search.big input {
  padding: 16px 0;
  font-size: 16px;
}
.hr {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 8px);
  z-index: 15;
  padding: 8px;
  display: none;
  flex-direction: column;
  gap: 2px;
  max-height: 380px;
  overflow: auto;
  border-radius: 18px;
  background: rgba(28, 12, 6, 0.95);
  border: 1px solid var(--line);
  backdrop-filter: blur(18px);
  box-shadow: 0 30px 60px -20px #000;
}
.hr.on {
  display: flex;
}
.hr .vi {
  width: 100%;
}
.hr small {
  color: var(--mut);
  font-size: 12px;
  display: block;
  font-weight: 500;
}
.top .hs {
  margin: 0 auto 0 8px;
  flex: 1;
  max-width: 460px;
  min-width: 0;
}
.top .search.big {
  border-radius: 12px;
  box-shadow: none;
  padding: 0 14px;
}
.top .search.big input {
  padding: 10px 0;
  font-size: 14px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 clamp(16px, 4vw, 48px) 70px;
}
.cat {
  --mx: 50%;
  --my: 30%;
  display: block;
  color: var(--wh);
  position: relative;
  min-height: 470px;
  border-radius: 30px;
  overflow: hidden;
  text-align: left;
  padding: 0;
  border: 1px solid rgba(255, 241, 222, 0.16);
  background: #1a0b05;
  isolation: isolate;
  transition:
    transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
    box-shadow 0.45s,
    border-color 0.45s;
  box-shadow: 0 30px 60px -30px #000;
}
.cat .cbg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.42;
  z-index: -3;
  transition:
    transform 0.8s,
    opacity 0.5s;
  filter: saturate(1.2);
}
.cat::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -2;
  background: linear-gradient(
    180deg,
    rgba(10, 4, 2, 0.15) 0%,
    rgba(28, 12, 6, 0.82) 62%,
    rgba(10, 4, 2, 0.96)
  );
}
.cat::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  opacity: 0;
  transition: opacity 0.4s;
  background: radial-gradient(
    440px circle at var(--mx) var(--my),
    rgba(242, 113, 28, 0.42),
    rgba(150, 60, 200, 0.3) 42%,
    rgba(106, 27, 206, 0.2) 58%,
    transparent 74%
  );
}
.cat:hover,
.cat:focus-visible {
  transform: translateY(-10px) scale(1.035);
  border-color: rgba(255, 165, 42, 0.75);
  box-shadow:
    0 40px 90px -30px rgba(242, 113, 28, 0.55),
    0 0 0 1px rgba(255, 165, 42, 0.4),
    0 0 60px -10px rgba(217, 83, 30, 0.55);
}
.cat:hover::after,
.cat:focus-visible::after {
  opacity: 1;
}
.cat:hover .cbg {
  transform: scale(1.08);
  opacity: 0.6;
}
.cat .in {
  position: absolute;
  inset: 0;
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 14px;
  backdrop-filter: blur(1px);
}
.cat h2 {
  font-size: clamp(22px, 2.2vw, 29px);
  line-height: 1.12;
}
.cat p {
  margin: 0;
  color: var(--mut);
  font-size: 14.5px;
}
.cat .meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.stack {
  display: flex;
}
.stack .lg {
  width: 40px;
  height: 40px;
  margin-left: -8px;
  border: 2px solid #1a0b05;
}
.stack .lg:first-child {
  margin-left: 0;
}
.count {
  font-family: Sora;
  font-size: 44px;
  font-weight: 700;
  line-height: 1;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.lg {
  background: #fff;
  border-radius: 12px;
  padding: 6px;
  display: grid;
  place-items: center;
  overflow: hidden;
  flex: none;
}
.lg.dk {
  background: #2a1209;
}
.lg.tile {
  padding: 0;
}
.lg.tile img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.lg img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.lg.wm {
  background: var(--grad);
  color: #fff;
  font: 700 11px/1.1 Sora;
  text-align: center;
  padding: 4px;
}
/* vendor shell */
.shell {
  display: grid;
  grid-template-columns: 318px 1fr;
  gap: 22px;
  padding: 22px clamp(14px, 3vw, 32px) 60px;
  max-width: 1560px;
  margin: 0 auto;
}
.side {
  position: sticky;
  top: calc(70px + env(safe-area-inset-top, 0px));
  align-self: start;
  max-height: calc(100vh - 92px);
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 12px;
}
.side h3 {
  font-size: 15px;
  line-height: 1.25;
}
.search {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-radius: 12px;
  background: rgba(255, 241, 222, 0.07);
  border: 1px solid var(--line);
}
.search input {
  flex: 1;
  background: none;
  border: 0;
  color: var(--wh);
  padding: 11px 0;
  font: inherit;
  outline: none;
  min-width: 0;
}
.vl {
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 0 -6px;
  padding: 0 6px;
}
.vi {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border-radius: 14px;
  border: 1px solid transparent;
  background: transparent;
  text-align: left;
  transition:
    background 0.2s,
    border-color 0.2s,
    transform 0.2s;
}
.vi:hover {
  background: rgba(255, 241, 222, 0.06);
}
.vi.on {
  background: linear-gradient(100deg, rgba(242, 113, 28, 0.24), rgba(106, 27, 206, 0.32));
  border-color: rgba(255, 165, 42, 0.55);
  box-shadow: 0 0 28px -8px rgba(242, 113, 28, 0.6);
}
.vi .lg {
  width: 44px;
  height: 44px;
}
.vi b {
  font-weight: 600;
  font-size: 14px;
  line-height: 1.25;
}
.page {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 18px;
  min-width: 0;
}
.sec {
  padding: 24px;
  min-width: 0;
}
.sec h3 {
  font-size: 17px;
  margin-bottom: 16px;
}
.s12 {
  grid-column: span 12;
}
.s7 {
  grid-column: span 7;
}
.s5 {
  grid-column: span 5;
}
.s6 {
  grid-column: span 6;
}
.vh {
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  overflow: hidden;
}
.vh > * {
  position: relative;
}
.vh::before {
  content: '';
  position: absolute;
  right: -120px;
  top: -160px;
  width: 460px;
  height: 460px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(242, 113, 28, 0.28),
    rgba(217, 83, 30, 0.14) 50%,
    transparent 70%
  );
  pointer-events: none;
}
.vh-top {
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
}
.vh .lg {
  width: 150px;
  height: 84px;
  border-radius: 18px;
  padding: 12px;
}
.vh-sum {
  display: grid;
  grid-template-columns: 1fr 270px;
  gap: 24px;
  margin-top: 8px;
}
.site {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px;
  border-radius: 18px;
  border: 1px solid rgba(245, 160, 58, 0.45);
  background: linear-gradient(135deg, rgba(242, 113, 28, 0.2), rgba(106, 27, 206, 0.2));
  color: var(--wh);
  transition:
    transform 0.3s,
    box-shadow 0.3s;
  align-self: stretch;
}
.site:hover {
  transform: translateY(-3px);
  box-shadow:
    0 20px 44px -20px rgba(242, 113, 28, 0.7),
    0 0 40px -14px rgba(106, 27, 206, 0.7);
}
.site .ic {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--grad);
  flex: none;
}
.site small {
  display: block;
  color: var(--mut);
  font-weight: 600;
}
.site b {
  font: 600 14px Sora;
  overflow-wrap: anywhere;
}
.site svg.x {
  margin-left: auto;
  color: var(--go);
}
.duo {
  display: grid;
  grid-template-columns: 7fr 5fr;
  gap: 18px;
  align-items: start;
}
.col {
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}
.vh h1 {
  font-size: clamp(26px, 3vw, 38px);
  line-height: 1.08;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 14px 0;
}
.sum {
  border-left: 2px solid;
  border-image: linear-gradient(180deg, var(--or), #6a1bce) 1;
  padding-left: 24px;
  position: relative;
}
.sum h3 {
  font-size: 14px;
  color: var(--go);
  margin-bottom: 10px;
}
.sum p {
  margin: 0;
  font-size: 16px;
  line-height: 1.65;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 18px;
}
.kpi {
  padding: 20px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition:
    transform 0.3s,
    box-shadow 0.3s,
    border-color 0.3s;
}
.kpi:hover {
  transform: translateY(-4px);
  border-color: rgba(255, 165, 42, 0.5);
  box-shadow: 0 24px 50px -24px rgba(242, 113, 28, 0.6);
}
.kpi .ic {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: rgba(242, 113, 28, 0.15);
  color: var(--go);
  margin-bottom: 6px;
}
.kpi small {
  color: var(--mut);
  font-weight: 600;
  font-size: 12.5px;
}
.kpi .v {
  font-family: Sora;
  font-weight: 700;
  font-size: clamp(18px, 1.7vw, 24px);
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.kpi .s {
  font-size: 12.5px;
  color: var(--mut);
}
.bar {
  height: 5px;
  border-radius: 9px;
  background: rgba(255, 241, 222, 0.1);
  margin-top: auto;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 9px;
  background: var(--grad);
  transition: width 1.1s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.mapw svg {
  width: 100%;
  height: auto;
  display: block;
}
.mapw .d {
  fill: rgba(255, 241, 222, 0.2);
}
.pin circle.c {
  fill: var(--or);
  stroke: var(--ye);
  stroke-width: 1.5;
  filter: drop-shadow(0 0 6px var(--or));
}
.pin circle.p {
  fill: none;
  stroke: var(--or);
  stroke-width: 1.5;
  transform-box: fill-box;
  transform-origin: center;
  animation: pulse 2.4s infinite;
}
@keyframes pulse {
  from {
    transform: scale(1);
    opacity: 0.9;
  }
  to {
    transform: scale(4);
    opacity: 0;
  }
}
.pin text {
  fill: var(--wh);
  font: 600 11px Manrope;
  paint-order: stroke;
  stroke: #0a0402;
  stroke-width: 3px;
}
.geo {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.gart {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.ring {
  display: flex;
  align-items: center;
  gap: 20px;
}
.ring svg {
  width: 112px;
  height: 112px;
  transform: rotate(-90deg);
}
.ring .n {
  font: 700 34px Sora;
}
.ring .n small {
  font-size: 15px;
  color: var(--mut);
}
.showcase {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}
.pc {
  display: flex;
  flex-direction: column;
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: rgba(20, 9, 5, 0.7);
  padding: 0;
  text-align: left;
  cursor: zoom-in;
  transition:
    transform 0.35s,
    box-shadow 0.35s,
    border-color 0.35s;
}
.pc:hover {
  transform: translateY(-6px);
  border-color: rgba(245, 160, 58, 0.55);
  box-shadow:
    0 26px 50px -24px rgba(242, 113, 28, 0.65),
    0 0 44px -16px rgba(106, 27, 206, 0.7);
}
.pm {
  position: relative;
  aspect-ratio: 4/3;
  overflow: hidden;
  display: grid;
  place-items: center;
}
.pm.cut {
  background: radial-gradient(
    68% 68% at 50% 42%,
    rgba(242, 113, 28, 0.34),
    rgba(106, 27, 206, 0.24) 58%,
    #14090a
  );
}
.pm.studio {
  background: linear-gradient(160deg, #fbf6f0, #e6dacd);
}
.pm.photo {
  background: #120805;
}
.pm img.f {
  position: relative;
  z-index: 1;
  max-width: 92%;
  max-height: 92%;
  width: auto;
  height: auto;
  object-fit: contain;
  transition: transform 0.6s;
}
.pm.cut img.f {
  max-width: 84%;
  max-height: 84%;
  filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.6));
}
.pm.studio img.f {
  mix-blend-mode: multiply;
  max-width: 86%;
  max-height: 86%;
}
.pm.photo img.f {
  max-width: 100%;
  max-height: 100%;
}
.pm img.b {
  position: absolute;
  inset: -12%;
  width: 124%;
  height: 124%;
  object-fit: cover;
  filter: blur(26px) brightness(0.5) saturate(1.25);
}
.pm.cv img.f {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  object-fit: cover;
  object-position: var(--pos, 50% 50%);
}
.pc:hover img.f {
  transform: scale(1.04);
}
.hv {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 60;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.88);
  transition:
    opacity 0.22s,
    transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.hv.on {
  opacity: 1;
  transform: scale(1);
}
.hvm {
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid rgba(245, 160, 58, 0.55);
  box-shadow:

// --- Helpers de formatação (escape de HTML, logos, valores monetários, faixas) ---
const ic = (n) => `<svg class="i" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const esc = (s) =>
  String(s ?? '').replace(
    /[&<>"]/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
  );
const ctry = (v) =>
  (v.country || '')
    .split('/')
    .map((s) => s.trim())
    .filter(Boolean);
const flag = (c) => (FL[c] || ['🌐'])[0];
const logo = (v, x = '') =>
  v.logo
    ? `<span class="lg ${v.logoDark ? 'dk' : ''} ${v.logoBg ? 'tile' : ''} ${x}" style="${v.logoBg ? 'background:' + v.logoBg : ''}"><img src="${v.logo}" alt="Logo ${esc(v.name)}"></span>`
    : `<span class="lg wm ${x}">${esc(v.name)}</span>`;
const nd = (t) => (t ? esc(t) : `<span class="nd">${ND}</span>`);
const big = (t) => {
  if (!t) return null;
  const m = t.match(/\(([^)]*)\)/) || t.match(/[-–]\s*([\d.,]+\s*(?:mi|bi))$/);
  const c = m ? m[1] : t;
  return /\d/.test(c) && /\b(mi|bi)\b/.test(c)
    ? 'US$ ' + c.replace(/^est(?:imate|\.)?\s*(?:de\s*)?/i, '~')
    : t;
};
const sub = (t) => (t && /^Capital fechado/.test(t) ? 'Capital fechado' : '');
const mx = (k) => Math.max(...V.map((v) => v[k] || 0));
const MAX = { mcap: mx('mcap'), rev: mx('rev'), emp: mx('emp') };
const pct = (v, k) => (v ? Math.max(5, (100 * Math.log(v + 1)) / Math.log(MAX[k] + 1)) : 0);
const fm = (n) =>
  n == null
    ? ND
    : n >= 1e9
      ? 'US$ ' + (n / 1e9).toFixed(1).replace('.0', '') + ' bi'
      : n >= 1e6
        ? 'US$ ' + Math.round(n / 1e6) + ' mi'
        : String(Math.round(n));
const revB = (v) =>
  v.rev == null ? 'n' : v.rev < 1e7 ? 'a' : v.rev < 1e8 ? 'b' : v.rev < 1e9 ? 'c' : 'd';
const mcB = (v) => (v.mcap == null ? 'n' : v.mcap < 5e8 ? 'a' : v.mcap < 5e9 ? 'b' : 'c');

const hits = (q) => {

function worldMap(pins, opt = {}) {
  let d = '';
  LAND.forEach((r, i) =>
    r.forEach(([a, b]) => {
      for (let c = a; c <= b; c++)
        d += `<circle class="d" cx="${c * 10 + 5}" cy="${i * 10 + 5}" r="3"/>`;
    }),
  );
  const P = pins
    .map((p) => {
      const g = FL[p.c];
      if (!g) return '';
      const x = ((g[1] + 180) / 5) * 10 + 5,
        y = ((80 - g[2]) / 5) * 10 + 5;
      return opt.cmp
        ? `<g data-a="fc" data-v="${esc(p.c)}"><circle class="mp" cx="${x}" cy="${y}" r="${7 + p.n * 2.2}"><title>${esc(p.c)}: ${p.n}</title></circle><text x="${x}" y="${y + 4}" text-anchor="middle" style="fill:#fff;font:700 11px Manrope;pointer-events:none">${p.n}</text></g>`
        : `<g class="pin"><circle class="p" cx="${x}" cy="${y}" r="5"/><circle class="c" cx="${x}" cy="${y}" r="6"/><text x="${x + 11}" y="${y + 4}">${esc(p.c)}</text></g>`;
    })
    .join('');
  return `<div class="mapw"><svg viewBox="0 0 720 290" role="img" aria-label="Mapa mundial">${d}${P}</svg></div>`;
}

// Perfil do fabricante: cartões de KPI, vídeo, Gartner
function kpi(i, l, v, s, p) {
  return `<div class="kpi glass"><div class="ic">${ic(i)}</div><small>${l}</small><div class="v">${v}</div><div class="s">${s || '&nbsp;'}</div><div class="bar"><i data-w="${p || 0}"></i></div></div>`;
}
function vid(v) {
  const u = v.video;
  if (!u) return `<p class="nd">${ND}</p>`;
  let k = null,
    id = null,
    m;
  if ((m = u.match(/youtube\.com\/watch\?v=([\w-]+)/))) {
    k = 'yt';
    id = m[1];
  } else if ((m = u.match(/vimeo\.com\/(\d+)/))) {
    k = 'vm';
    id = m[1];
  }
  const cap = v.case && v.case != 'Institucional' ? v.case : 'Vídeo institucional',
    ph = v.prods.find((p) => p.kind == 'photo') || v.prods[0];
  return `<div class="vid" id="vid" data-k="${k || ''}" data-id="${id || ''}" data-u="${esc(u)}">${ph ? `<img class="pv" src="${ph.src}" style="object-position:${ph.pos}" alt="">` : ''}<div class="vcap">${esc(cap)}</div>${k ? `<button class="play" data-a="play" aria-label="Reproduzir vídeo"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></button>` : `<a class="btn pri" href="${esc(u)}" target="_blank" rel="noopener">Assistir no site do fabricante ${ic('ext')}</a>`}</div>${k ? `<p class="vfb">Problemas para reproduzir? <a href="${esc(u)}" target="_blank" rel="noopener">assistir em nova aba ${ic('ext')}</a></p>` : ''}`;
}
// Cria o iframe do YouTube/Vimeo ao clicar em "play"
function mkFrame(box, n) {
  const old = box.querySelector('iframe');
  if (old) old.remove();
  const id = box.dataset.id;
  const src =
    box.dataset.k == 'yt'
      ? ['https://www.youtube.com/embed/', 'https://www.youtube-nocookie.com/embed/'][n] +
        id +
        '?autoplay=1&rel=0&playsinline=1&modestbranding=1'
      : 'https://player.vimeo.com/video/' + id + '?autoplay=1';
  const f = document.createElement('iframe');
  f.src = src;
  f.title = 'Vídeo institucional';
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write; web-share';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.dataset.n = n;
  box.appendChild(f);
}
// Se o host bloquear o player (CSP), tenta youtube-nocookie e, se falhar, mostra link externo
document.addEventListener('securitypolicyviolation', (e) => {
  const f = document.querySelector('.vid iframe');
  if (!f || !/youtube|vimeo/.test(e.blockedURI || '')) return;
  const box = f.parentElement,
    n = +f.dataset.n;
  if (box.dataset.k == 'yt' && n == 0) {
    mkFrame(box, 1);
    return;
  }
  f.remove();
  box.insertAdjacentHTML(
    'beforeend',
    `<div class="vblk"><p>O ambiente em que esta página está publicada bloqueou o player incorporado. O vídeo continua disponível em sua fonte original.</p><a class="btn pri" href="${esc(box.dataset.u)}" target="_blank" rel="noopener">Assistir no ${box.dataset.k == 'yt' ? 'YouTube' : 'Vimeo'} ${ic('ext')}</a></div>`,
  );
});
function gart(v) {
  if (v.gscore == null && !v.gpot)
    return `<p class="nd">O fabricante não possui informações Gartner disponíveis nos dados fornecidos.</p>`;
  const s = v.gscore,
    C = 2 * Math.PI * 46;
  return `<div class="gart"><div class="ring"><svg viewBox="0 0 112 112"><circle cx="56" cy="56" r="46" fill="none" stroke="rgba(255,241,222,.1)" stroke-width="10"/>${s != null ? `<circle cx="56" cy="56" r="46" fill="none" stroke="url(#gg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C * s) / 5} ${C}"/>` : ''}<defs><linearGradient id="gg"><stop offset="0" stop-color="#F2711C"/><stop offset="1" stop-color="#7A2BD0"/></linearGradient></defs></svg><div><div class="n">${s != null ? s : '—'}<small> / 5</small></div><small style="color:var(--mut)">Score Gartner</small></div></div>
 <div><small style="color:var(--mut)">Potencial de crescimento</small><div style="margin-top:6px"><span class="chip ${v.gpot == 'ALTO' ? 'hot' : 'vio'}">${v.gpot || ND}</span></div></div>
 <div style="font-size:14px"><small style="color:var(--mut)">Insights</small><br>${v.gsrc ? `Fabricante citado no Magic Quadrant da Gartner pela quinta vez. <a href="${esc(v.gsrc)}" target="_blank" rel="noopener">Fonte ${ic('ext')}</a>` : `<span class="nd">Insights detalhados não constam nos dados fornecidos.</span>`}</div></div>`;
}

// --- Comparativo Geral: filtros + ranking, gráficos, mapa e tabela ---
function filt() {
  const f = S.f;
  return V.filter(
    (v) =>
      (!f.cat || v.cat == f.cat) &&
      (!f.country || ctry(v).includes(f.country)) &&
      (!f.listed || (f.listed == 's') == v.listed) &&
      (!f.rev || revB(v) == f.rev) &&
      (!f.mc || mcB(v) == f.mc),
  );
}
function compare() {
  const F = filt(),
    f = S.f,

    `<label>${l}<select data-f="${k}"><option value="">Todos</option>${o.map(([a, b]) => `<option value="${a}" ${f[k] == a ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></label>`;

    rev: ['Receita anual', 'rev'],
    mcap: ['Market Cap', 'mcap'],
    emp: ['Headcount', 'emp'],

    mm = rk[0] ? rk[0][S.metric] : 1,
    tx = { rev: 'revTxt', mcap: 'mcapTxt', emp: 'empTxt' }[S.metric];
  const cats = [1, 2, 3].map((c) => [c, F.filter((v) => v.cat == c).length]),
    cm = Math.max(1, ...cats.map((x) => x[1]));
  const pc = {};
  F.forEach((v) => ctry(v).forEach((c) => (pc[c] = (pc[c] || 0) + 1)));
  const T = [...F].sort((a, b) => {
    const k = S.sort,
      x = k == 'name' || k == 'country' ? (a[k] || '').toString() : (a[k] ?? -1),
      y = k == 'name' || k == 'country' ? (b[k] || '').toString() : (b[k] ?? -1);
    return (x > y ? 1 : x < y ? -1 : 0) * S.dir;
  });
  const th = (k, l) =>
    `<th tabindex="0" data-a="sort" data-v="${k}">${l}${S.sort == k ? (S.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  return `<div class="cmp"><h1>Comparativo Geral</h1>
 <div class="glass flt">${sel(
   'cat',
   'Categoria',
   [1, 2, 3].map((c) => [c, CATS[c].t]),
 )}${sel(
   'country',

   cn.map((c) => [c, c]),
 )}${sel('listed', 'Capital aberto', [

 ])}${sel('rev', 'Faixa de faturamento', [

   ['d', 'Acima de US$ 1 bi'],
   ['n', ND],
 ])}${sel('mc', 'Market Cap', [
   ['a', 'Até US$ 500 mi'],
   ['b', 'US$ 500 mi–5 bi'],
   ['c', 'Acima de US$ 5 bi'],
   ['n', ND],
 ])}<button class="btn" data-a="reset">Limpar filtros</button></div>
 <div class="ks"><div class="glass"><b>${F.length}</b><span>Fabricantes</span></div><div class="glass"><b>${F.filter((v) => v.listed).length}</b><span>Capital aberto</span></div><div class="glass"><b>${Object.keys(pc).length}</b><span>Países de origem</span></div><div class="glass"><b>${F.filter((v) => v.gscore != null).length}</b><span>Com score Gartner</span></div></div>
 <div class="grid2"><section class="sec glass"><h3>Ranking visual</h3><div class="tabs">${Object.entries(
   M,
 )
   .map(
     ([k, [l]]) =>
       `<button class="${S.metric == k ? 'on' : ''}" data-a="metric" data-v="${k}">${l}</button>`,
   )
   .join(
     '',
   )}</div><div class="rkl">${rk.map((v) => `<button class="rk" data-a="v2" data-v="${v.id}"><span class="t">${esc(v.name)}</span><span class="b"><i style="width:${Math.max(3, (100 * Math.log(v[S.metric] + 1)) / Math.log(mm + 1))}%"></i></span><em>${esc(v[tx])}</em></button>`).join('') || `<p class="nd">${ND}</p>`}</div><p class="nd" style="font-size:12px;margin:10px 0 0">Barras em escala logarítmica; faixas plotadas pelo ponto médio. Valores exibidos conforme o arquivo.</p></section>
 <div style="display:flex;flex-direction:column;gap:18px"><section class="sec glass"><h3>Empresas por categoria</h3>${cats.map(([c, n]) => `<button class="rk" style="grid-template-columns:1fr 40px" data-a="fcat" data-v="${c}"><span><span class="t" style="display:block;margin-bottom:5px;white-space:normal">${CATS[c].t}</span><span class="b" style="display:block"><i style="width:${(100 * n) / cm}%"></i></span></span><em style="font-size:20px;color:var(--wh)">${n}</em></button>`).join('')}</section>
 <section class="sec glass"><h3>Distribuição global</h3>${worldMap(
   Object.entries(pc).map(([c, n]) => ({ c, n })),
   { cmp: 1 },
 )}</section></div></div>
 <section class="sec glass"><h3>Matriz comparativa</h3><div class="tw"><table><thead><tr>${th('name', 'Fabricante')}${th('country', 'País')}${th('mcap', 'Market Cap')}${th('rev', 'Faturamento')}${th('emp', 'Funcionários')}${th('listed', 'Capital aberto')}</tr></thead><tbody>${T.map(
   (v) =>
     `<tr tabindex="0" data-a="v2" data-v="${v.id}"><td><span class="n">${logo(v)}${esc(v.name)}</span></td><td>${
       ctry(v)
         .map((c) => flag(c) + ' ' + esc(c))
         .join(' / ') || nd()
     }</td><td>${v.mcapTxt ? esc(v.mcapTxt) : nd()}</td><td>${v.revTxt ? 'US$ ' + esc(v.revTxt) : nd()}</td><td>${v.empTxt ? esc(v.empTxt) : nd()}</td><td><span class="chip ${v.listed ? 'hot' : ''}">${v.listed ? 'Sim · ' + esc(v.exchange) : 'Não'}</span></td></tr>`,
 ).join('')}</tbody></table></div></section></div>`;
}

// ========================================================================
// Renderização e navegação
// ========================================================================
function render() {
  const a = $('#app');
  a.innerHTML = S.view == 'home' ? home() : S.view == 'cat' ? shell() : compare();
  $('#n-home').classList.toggle('on', S.view != 'compare');
  $('#n-cmp').classList.toggle('on', S.view == 'compare');
  requestAnimationFrame(() =>
    requestAnimationFrame(() =>
      document.querySelectorAll('[data-w]').forEach((e) => (e.style.width = e.dataset.w + '%')),
    ),
  );
  const vl = $('#vl'),
    on = document.querySelector('.vi.on');
  if (S.view == 'cat' && vl && on && vl.getBoundingClientRect) {
    vl.scrollTop =
      on.getBoundingClientRect().top -
      vl.getBoundingClientRect().top +
      vl.scrollTop -
      vl.clientHeight / 2 +
      on.offsetHeight / 2;
  }
}
function go(view, o = {}) {
  const hq = document.getElementById('hq');
  if (hq) {
    hq.value = '';
    document.getElementById('hr').classList.remove('on');
  }
  Object.assign(S, o, { view });
  if (view == 'cat' && S.vid == null) S.vid = V.find((v) => v.cat == S.cat).id;
  scrollTo({ top: 0 });
  render();
  history.replaceState(
    null,
    '',
    '#' + { home: 'home', compare: 'compare', cat: 'cat' + S.cat }[view],
  );
}

// Roteador de cliques: todo elemento com data-a="ação" (e data-v="valor") passa por aqui
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  const a = t.dataset.a,
    v = t.dataset.v;
  if (t.tagName == 'A') e.preventDefault();
  if (a == 'home') go('home');
  else if (a == 'compare') go('compare');
  else if (a == 'cat') go('cat', { cat: +v, q: '', vid: V.find((x) => x.cat == +v).id });
  else if (a == 'v') {
    hvHide();
    S.vid = +v;
    $('#vl').innerHTML = vlist();
    $('#vp').innerHTML = vendor();
    render2();
    scrollTo({ top: 0, behavior: 'smooth' });
  } else if (a == 'v2') go('cat', { cat: V.find((x) => x.id == +v).cat, vid: +v, q: '' });
  else if (a == 'metric') {
    S.metric = v;
    render();
  } else if (a == 'sort') {
    S.dir = S.sort == v ? -S.dir : 1;
    S.sort = v;
    render();
  } else if (a == 'reset') {
    S.f = { cat: '', country: '', listed: '', rev: '', mc: '' };
    render();
  } else if (a == 'fc') {
    S.f.country = v;
    render();
  } else if (a == 'fcat') {
    S.f.cat = v;
    render();
  } else if (a == 'zoom') {
    hvHide();
    LB.list = V.find((x) => x.id == S.vid).prods;
    LB.i = +v;
    lbShow();
  } else if (a == 'lbclose') lbHide();
  else if (a == 'lbprev') lbGo(-1);
  else if (a == 'lbnext') lbGo(1);
  else if (a == 'play') {
    mkFrame(t.parentElement, 0);
    t.remove();
  }
});
// Anima as barras (data-w) depois que o HTML novo entra na página
function render2() {
  requestAnimationFrame(() =>
    requestAnimationFrame(() =>
      document.querySelectorAll('[data-w]').forEach((e) => (e.style.width = e.dataset.w + '%')),
    ),
  );
}
// ========================================================================
// Interações visuais
//
// Pré-visualização de produto ao passar o mouse (hover)
// ========================================================================
const hv = document.createElement('div');
hv.className = 'hv';
document.body.appendChild(hv);
let HVc = null;
function hvHide() {
  HVc = null;
  hv.classList.remove('on');
}
function hvShow(c, p) {
  const r = c.getBoundingClientRect(),
    vw = innerWidth,
    vh = innerHeight,
    pad = p.kind == 'photo' ? 0 : 14;
  const W = Math.min(vw - 24, Math.max(r.width * 1.5, 460), 700);
  let w = Math.min(W - 2 * pad, p.w * 1.15),
    h = (w * p.h) / p.w;
  const mh = vh * 0.6;
  if (h > mh) {
    h = mh;
    w = (h * p.w) / p.h;
  }
  const BW = Math.min(vw - 24, Math.max(w + 2 * pad, 340));
  hv.innerHTML = `<div class="hvm" style="width:${BW}px"><div class="hvi ${p.kind}" style="padding:${pad}px"><img src="${p.src}" alt="" style="display:block;width:${w}px;height:${h}px"></div><div class="hvt"><span class="chip hot">${esc(p.cat)}</span><h4>${esc(p.name)}</h4><p>${esc(p.desc)}</p></div></div>`;
  const bh = hv.firstChild.offsetHeight;
  let x = r.left + r.width / 2 - BW / 2,
    y = r.top + r.height / 2 - bh / 2;
  x = Math.max(12, Math.min(x, vw - BW - 12));
  y = Math.max(72, Math.min(y, vh - bh - 12));
  hv.style.left = x + 'px';
  hv.style.top = y + 'px';
  hv.classList.add('on');
}
document.addEventListener('pointerover', (e) => {
  if (!matchMedia('(hover:hover)').matches) return;
  const c = e.target.closest('.pc');
  if (!c || c === HVc) return;
  HVc = c;
  hvShow(c, V.find((x) => x.id == S.vid).prods[+c.dataset.v]);
});
document.addEventListener('pointerout', (e) => {
  if (HVc && !(e.relatedTarget && HVc.contains(e.relatedTarget))) hvHide();
});
addEventListener('scroll', hvHide, { passive: true });

// --- Lightbox: imagem de produto ampliada, com navegação por setas ---
const LB = { list: [], i: 0 };
function lbShow() {
  const p = LB.list[LB.i],
    e = $('#lb');
  e.hidden = false;
  e.querySelector('.lbm').className = 'lbm ' + p.kind;
  e.querySelector('img').src = p.src;
  e.querySelector('img').alt = p.name;
  e.querySelectorAll('.lbn').forEach((b) => (b.hidden = LB.list.length < 2));
  e.querySelector('.lbc').innerHTML =
    `<span class="chip hot">${esc(p.cat)}</span><h4>${esc(p.name)}</h4><p>${esc(p.desc)}</p><small>${LB.i + 1} / ${LB.list.length}</small>`;
  document.body.style.overflow = 'hidden';
}
function lbHide() {
  $('#lb').hidden = true;
  document.body.style.overflow = '';
}
function lbGo(d) {
  LB.i = (LB.i + d + LB.list.length) % LB.list.length;
  lbShow();
}
document.body.insertAdjacentHTML(
  'beforeend',
  '<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Imagem ampliada"><button class="lbx" data-a="lbclose" aria-label="Fechar">✕</button><button class="lbn l" data-a="lbprev" aria-label="Anterior">‹</button><div class="lbm"><img alt=""></div><button class="lbn r" data-a="lbnext" aria-label="Próxima">›</button><div class="lbc"></div></div>',
);
document.addEventListener('click', (e) => {
  if (e.target.id == 'lb') lbHide();
});
document.addEventListener('keydown', (e) => {
  if (!$('#lb').hidden) {
    if (e.key == 'Escape') lbHide();
    else if (e.key == 'ArrowLeft') lbGo(-1);
    else if (e.key == 'ArrowRight') lbGo(1);
  }
});

// --- Brilho de fundo que acompanha o cursor (respeita prefers-reduced-motion) ---
const gl = document.createElement('div');
gl.className = 'glow';
document.body.appendChild(gl);
let gx = innerWidth / 2,
  gy = innerHeight / 3,
  tx = gx,
  ty = gy,
  run = false;
const rmo = matchMedia('(prefers-reduced-motion:reduce)').matches;
function lp() {
  gx += (tx - gx) * 0.12;
  gy += (ty - gy) * 0.12;
  gl.style.transform = `translate(${gx - 280}px,${gy - 280}px)`;
  if (Math.abs(tx - gx) > 0.4 || Math.abs(ty - gy) > 0.4) requestAnimationFrame(lp);
  else run = false;
}
lp();
addEventListener('pointermove', (e) => {
  tx = e.clientX;
  ty = e.clientY;
  if (rmo) {
    gx = tx;
    gy = ty;
  }
  if (!run) {
    run = true;
    requestAnimationFrame(lp);
  }
});
// ========================================================================
// Eventos de busca, teclado e filtros
// ========================================================================
document.addEventListener('input', (e) => {
  if (e.target.id == 'q') {
    S.q = e.target.value;
    $('#vl').innerHTML = vlist();
  } else if (e.target.id == 'hq') {
    const h = hits(e.target.value),
      r = $('#hr');
    r.innerHTML = h.length
      ? h
          .map(
            (v) =>
              `<button class="vi" data-a="v2" data-v="${v.id}">${logo(v)}<span><b>${esc(v.name)}</b><small>${esc(CATS[v.cat].t)}</small></span></button>`,
          )
          .join('')
      : e.target.value.trim()
        ? '<p class="nd" style="margin:10px">Nenhum fabricante encontrado.</p>'
        : '';
    r.classList.toggle('on', !!r.innerHTML);
  }
});
document.addEventListener('keydown', (e) => {
  if (
    (e.key == 'Enter' || e.key == ' ') &&
    e.target.matches &&
    e.target.matches('[tabindex][data-a]')
  ) {
    e.preventDefault();
    e.target.click();
  }
});
document.addEventListener('keydown', (e) => {
  const b = e.target.closest && e.target.closest('#hr .vi');
  if (!b) return;
  if (e.key == 'ArrowDown') {
    e.preventDefault();
    (b.nextElementSibling || b).focus();
  } else if (e.key == 'ArrowUp') {
    e.preventDefault();
    (b.previousElementSibling || $('#hq')).focus();
  } else if (e.key == 'Escape') {
    $('#hq').focus();
    $('#hr').classList.remove('on');
  }
});
document.addEventListener('keydown', (e) => {
  if (e.target.id == 'hq') {
    if (e.key == 'ArrowDown') {
      const f = document.querySelector('#hr .vi');
      if (f) {
        e.preventDefault();
        f.focus();
      }
    }
    if (e.key == 'Enter') {
      const h = hits(e.target.value);
      if (h[0]) go('cat', { cat: h[0].cat, vid: h[0].id, q: '' });
    } else if (e.key == 'Escape') $('#hr').classList.remove('on');
  }
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.hs')) {
    const r = document.getElementById('hr');
    if (r) r.classList.remove('on');
  }
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset.f;
  if (k) {
    S.f[k] = e.target.value;
    render();
    const s = document.querySelector(`select[data-f="${k}"]`);
    if (s) s.focus();
  }
});
// Efeito de luz nos cards de categoria (posição do mouse em --mx/--my)
document.addEventListener('pointermove', (e) => {
  const c = e.target.closest('.cat');
  if (c) {
    const r = c.getBoundingClientRect();
    c.style.setProperty('--mx', e.clientX - r.left + 'px');
    c.style.setProperty('--my', e.clientY - r.top + 'px');
  }
});
// ========================================================================
// Inicialização
// Imagem de fundo + abre a tela indicada no #hash da URL (#home, #compare, #cat1..3)
// ========================================================================
document.body.insertAdjacentHTML(
  'afterbegin',
  `<img src="${D.bg}" alt="" style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.2;filter:grayscale(1) sepia(1) saturate(2.2) hue-rotate(-12deg);z-index:-2;pointer-events:none">`,
);
const h = location.hash.slice(1);
go(
  h == 'compare' ? 'compare' : /^cat[123]$/.test(h) ? 'cat' : 'home',
  /^cat[123]$/.test(h) ? { cat: +h[3], vid: null } : {},
);
</script>
